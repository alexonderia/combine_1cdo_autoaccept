# Настройки текстов для JSON чек-листа.
# Скопируйте этот файл в checklist_texts.yml и при необходимости
# измените формулировки ответов. Путь к файлу можно переопределить
# переменной окружения CHECKLIST_TEXTS_PATH.
answers:
  # Базовые ответы "Да/Нет" и текст при отсутствии данных.
  bool_yes: "Да"
  bool_no: "Нет"
  missing: "Нет данных"

  # Формулировки для сущ/отсутствия единичных документов.
  available_yes: "Имеется"
  available_no: "Не имеется"

  # Формулировки для множественных документов.
  collection_yes: "Имеются"
  collection_no: "Не имеются"

  # Формулировки для детализированных блоков (налоги, кредиты и т.п.).
  exists_yes: "Есть"
  exists_no: "Нет"

  # Ответы для блока о проверках государственных органов.
  inspection_found_yes: "Выявляли"
  inspection_found_no: "Не выявляли"

